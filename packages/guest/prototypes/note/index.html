<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e8f4d8">
<title>Поле заметки — стенд вариантов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@400;500;600&family=Roboto+Mono:wght@400&display=swap" rel="stylesheet">
<style>
/*
 * Стенд материала поля-заметки (.note из packages/guest/src/styles/note.css).
 *
 * Зачем: на живой странице панель читается плотным цветным пятном — она
 * насыщеннее обоев (saturate 1.4), светлее их (заливка .35) и стоит на тени
 * карточки-героя (--sh-card, 26/54px). Три причины сложены в один материал, и
 * на глаз не разобрать, какая из них весит больше. Стенд разбирает их на
 * отдельные ручки и ставит варианты рядом — судить на той же бумаге, на тех же
 * обоях и под той же карточкой, что у гостя.
 *
 * Это прототип, а не часть сборки: один HTML без React, Vite и зависимостей.
 * Токены и правила .note скопированы из проекта; при правках в проекте копию
 * здесь надо обновить руками. Карточка места упрощена намеренно (у гостя это
 * стеклянное кольцо на SVG-фильтре, здесь — фото со скримом): её роль на стенде
 * — вес над полем, а не собственный пиксель.
 *
 * Все числа материала живут в CSS-переменных --n-* на .note. Варианты их только
 * переставляют, ползунки — двигают поверх выбранного варианта, а панель «CSS»
 * собирает из них готовый блок для note.css. Поэтому ни один вариант не
 * захардкожен в разметке: что видно на стенде, то и уезжает в проект.
 */

/* --- токены проекта (копия packages/shared/styles/tokens.css) ------------- */
:root {
  --c-ink: #211c16;
  --c-ink-soft: #6f6558;
  --c-ink-faint: #a1968a;
  --c-answer: #424343;
  --c-frame-ink: #fff5c0;
  --c-wallpaper: #e8f4d8;
  --c-surface-sunk: #e6efdc;
  --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  --font-card: 'Inter Tight', var(--font-ui);
  --font-mono: 'Roboto Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --w-medium: 500;
  --w-semibold: 600;
  --s-4: 1rem;
  --r-card: 48px;
  --card-ratio: 480 / 314;
  --corner-card: squircle;
  --sh-card: 0 4px 12px rgba(63, 46, 26, 0.13), 0 26px 54px rgba(63, 46, 26, 0.2);
  --dur-fast: 140ms;
  --ease: cubic-bezier(0.22, 0.61, 0.36, 1);

  /* Ширина колоды у гостя на телефоне (--env-w): от неё считается ширина поля. */
  --env-w: 335px;
}

* { box-sizing: border-box; }

html {
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

body {
  margin: 0;
  font-family: var(--font-ui);
  color: var(--c-ink);
  background: #eceff1;
}

/* --- раскладка стенда ------------------------------------------------------ */

.stand {
  display: grid;
  /* Сцена слева фиксированной ширины телефона, пульт справа тянется. */
  grid-template-columns: 420px minmax(320px, 1fr);
  gap: 24px;
  padding: 24px;
  align-items: start;
  max-width: 1180px;
  margin: 0 auto;
}

@media (max-width: 900px) {
  .stand {
    grid-template-columns: 1fr;
    padding: 16px;
  }
}

/* --- сцена: кусок гостевой страницы --------------------------------------- */

.scene {
  position: relative;
  width: 100%;
  /* Высота под колонку: карточка + панель + воздух. Прокрутка своя — в режиме
     «все сразу» шесть панелей в экран не влезают. */
  height: 760px;
  border-radius: 28px;
  overflow: auto;
  background: var(--c-wallpaper);
  box-shadow: 0 1px 2px rgba(20, 30, 15, 0.1), 0 18px 40px rgba(20, 30, 15, 0.16);
}

/*
 * Обои — тот же файл, что у гостя (src/assets/wallpaper.webp), и той же
 * раскладкой: растянуты целиком (100% 100%), а не вписаны по cover. Слой
 * фиксирован внутри сцены, поэтому при прокрутке панелей фон стоит на месте —
 * как на странице, где обои тоже не едут.
 */
.scene__paper {
  position: sticky;
  top: 0;
  height: 0;
  z-index: 0;
}

.scene__paper::before {
  content: '';
  position: absolute;
  inset: 0;
  height: 760px;
  background-image: url('../../src/assets/wallpaper.webp');
  background-size: 260% 180%;
  /* Участок обоев переключается пультом: панель обязана держаться и на бледном
     верхе, и на синем пятне снизу-слева — материал стекла на них ведёт себя
     по-разному. */
  background-position: var(--paper-pos, 50% 30%);
  transition: background-position 320ms var(--ease);
}

.scene__inner {
  position: relative;
  z-index: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--s-4);
  padding: 40px 20px 60px;
}

/* --- карточка места (упрощённая копия .card) ------------------------------ */

.card {
  position: relative;
  width: var(--env-w);
  aspect-ratio: var(--card-ratio);
  border-radius: var(--r-card);
  corner-shape: var(--corner-card);
  overflow: hidden;
  background: var(--c-surface-sunk);
  box-shadow: var(--sh-card);
  flex: none;
}

.card__photo {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
}

/*
 * Подложка под названием. У гостя её нет: там текст лежит прямо на кадре, а
 * читаемость держат боковые внутренние тени карточки. Здесь скрим добавлен
 * затем, что фото на стенде может оказаться любым (папка demo/ вне гита), а
 * название должно остаться читаемым на любом.
 */
.card__scrim {
  position: absolute;
  inset: 0;
  background: linear-gradient(180deg, rgba(20, 16, 10, 0) 45%, rgba(20, 16, 10, 0.35) 100%);
}

/* Нет фото — кадр не ломает сцену, а честно показывает, что снимка нет. */
.card--nophoto .card__photo { display: none; }
.card--nophoto {
  background: linear-gradient(140deg, #8d9b7e, #5d6b56 60%, #3f4a3c);
}

.card__body {
  position: absolute;
  left: 4.38cqw;
  bottom: 4.79cqw;
  max-width: 62%;
}

.card {
  container-type: inline-size;
}

.card__name {
  font-family: var(--font-card);
  font-size: 24px;
  font-weight: var(--w-semibold);
  line-height: 1;
  letter-spacing: -0.06em;
  color: var(--c-frame-ink);
}

.card__address {
  font-family: var(--font-card);
  font-size: 16px;
  font-weight: var(--w-semibold);
  line-height: calc(14 / 16);
  color: var(--c-frame-ink);
}

.card__dots {
  position: absolute;
  right: 5cqw;
  bottom: 6cqw;
  display: flex;
  gap: 6px;
}

.card__dots i {
  width: 7px;
  height: 7px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.45);
}

.card__dots i.on { background: #fff; }

/* --- поле заметки: копия .note из note.css -------------------------------- */

/*
 * Правила один в один из packages/guest/src/styles/note.css, с одной разницей:
 * все числа материала вынесены в переменные --n-*. В проекте они стоят
 * значениями прямо в свойствах; здесь их надо крутить, иначе стенд не стенд.
 * Значения по умолчанию — ровно те, что в проекте сейчас.
 */
.note {
  /* значения варианта «Сейчас» — их переставляют пресеты и ползунки */
  --n-fill: 0.35;      /* заливка стекла, альфа белого */
  --n-sat: 1.4;        /* saturate в backdrop-filter */
  --n-blur: 12px;      /* blur в backdrop-filter */
  --n-edge: 1;         /* множитель яркости градиентной кромки */
  --n-hl1: 0.58;       /* внутренний блик по верхней грани */
  --n-hl2: 0.34;       /* и по нижней */
  --n-sunk: 0;         /* внутренняя тень сверху: «вдавленное» стекло */
  --n-sh1y: 4px;  --n-sh1b: 12px; --n-sh1a: 0.13;  /* ближняя тень */
  --n-sh2y: 26px; --n-sh2b: 54px; --n-sh2a: 0.2;   /* дальняя тень */
  --n-r: 36px;         /* радиус */
  --n-pt: 12px; --n-px: 16px; --n-pb: 16px;        /* поля плашки */
  --n-gap: 10px;
  --n-min: 40px;       /* минимальная высота строки ввода */
  --n-send: 22px;      /* кегль «Send» */
  --n-label: 12px;     /* кегль подписи «Add note» */

  position: relative;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: var(--n-gap);
  font-family: 'Inter Tight', var(--font-ui);
  /* Десктопная ширина заметки — 328px (min(100%, 20.5rem)) как у гостя на широком
     экране. Телефонная посадка (.note--mobile) сужает её до грани карточки. */
  width: min(100%, 20.5rem);
  padding: var(--n-pt) var(--n-px) var(--n-pb);
  border-radius: var(--n-r);
  corner-shape: squircle;
  border: 1px solid transparent;
  background:
    rgba(255, 255, 255, var(--n-fill)) padding-box,
    linear-gradient(
      180deg,
      rgba(255, 255, 255, calc(0.72 * var(--n-edge))) 0%,
      rgba(255, 255, 255, calc(0.22 * var(--n-edge))) 26%,
      rgba(120, 108, 86, calc(0.08 * var(--n-edge))) 55%,
      rgba(255, 255, 255, calc(0.3 * var(--n-edge))) 88%,
      rgba(255, 255, 255, calc(0.46 * var(--n-edge))) 100%
    ) border-box;
  backdrop-filter: blur(var(--n-blur)) saturate(var(--n-sat));
  -webkit-backdrop-filter: blur(var(--n-blur)) saturate(var(--n-sat));
  /*
   * Пять слоёв одной строкой: вдавленность, два внутренних блика и две тени.
   * Слои с нулевой альфой ничего не рисуют — так один и тот же набор описывает
   * и парящую плашку («Сейчас»), и утопленную (вариант D), и голый контур (B),
   * и переключение вариантов остаётся сменой чисел, а не правил.
   */
  box-shadow:
    inset 0 2px 5px rgba(63, 46, 26, var(--n-sunk)),
    inset 0 1px 0 rgba(255, 255, 255, var(--n-hl1)),
    inset 0 -1px 0 rgba(255, 255, 255, var(--n-hl2)),
    0 var(--n-sh1y) var(--n-sh1b) rgba(63, 46, 26, var(--n-sh1a)),
    0 var(--n-sh2y) var(--n-sh2b) rgba(63, 46, 26, var(--n-sh2a));
  transition:
    background-color var(--dur-fast) var(--ease),
    box-shadow var(--dur-fast) var(--ease);
}

/* Фокус. В проекте заливка прыгает .35 → .50 и кромка разгорается. На лёгкой
   базе тот же скачок читается вспышкой, поэтому здесь он тоже в переменных:
   пульт даёт посмотреть фокус у любого варианта. Два входа: тумблер «состояние
   фокуса» вешает .is-focus принудительно, а живой клик в поле — :focus-within,
   и тогда в поле можно набирать. Оба ведут к одному материалу. */
.note.is-focus,
.note:focus-within {
  background:
    rgba(255, 255, 255, calc(var(--n-fill) + var(--n-focus-step, 0.15))) padding-box,
    linear-gradient(
      180deg,
      rgba(255, 255, 255, calc(0.85 * var(--n-edge))) 0%,
      rgba(255, 255, 255, calc(0.28 * var(--n-edge))) 26%,
      rgba(120, 108, 86, calc(0.1 * var(--n-edge))) 55%,
      rgba(255, 255, 255, calc(0.38 * var(--n-edge))) 88%,
      rgba(255, 255, 255, calc(0.56 * var(--n-edge))) 100%
    ) border-box;
}

.note__label {
  font-size: var(--n-label);
  font-weight: var(--w-medium);
  line-height: 16px;
  letter-spacing: -0.12px;
  color: var(--c-ink-soft);
}

.note__input {
  position: relative;
  width: 100%;
  margin-top: -4px;
}

.note__field {
  display: block;
  width: 100%;
  min-height: var(--n-min);
  padding: 0;
  border: none;
  background: none;
  font: inherit;
  font-size: 14px;
  line-height: 18px;
  font-weight: var(--w-medium);
  letter-spacing: 0;
  color: var(--c-answer);
  caret-color: var(--c-answer);
  resize: none;
  overflow: hidden;
}

.note__field:focus { outline: none; }

.note__ghost {
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  font-size: 14px;
  line-height: 18px;
  font-weight: var(--w-medium);
  letter-spacing: 0;
  color: var(--c-answer);
  white-space: pre-wrap;
  pointer-events: none;
}

.note__caret {
  display: inline-block;
  width: 2px;
  height: 1.05em;
  margin-left: 1px;
  border-radius: 1px;
  vertical-align: -0.16em;
  background: var(--c-answer);
  animation: note-caret-blink 1.1s steps(1) infinite;
}

@keyframes note-caret-blink {
  0%, 50% { opacity: 1; }
  50.01%, 100% { opacity: 0; }
}

.note__send {
  align-self: flex-end;
  padding: 0;
  margin-right: 8px;
  border: none;
  background: none;
  font-family: inherit;
  font-size: var(--n-send);
  font-weight: var(--w-semibold);
  line-height: 1.1;
  letter-spacing: 0.1px;
  color: var(--c-answer);
  cursor: pointer;
}

/*
 * Структурные варианты. Всё, что не сводится к числу: у B плоская кромка вместо
 * градиентной, у C плашки нет вовсе и поле держит линейка под строкой, у D
 * кромка перевёрнута — тёмная сверху, светлая снизу, как у выемки.
 */

/* B. Контур: заливки и блюра нет, остаётся одна ровная белая волосяная кромка. */
.note.v-b {
  background:
    rgba(255, 255, 255, var(--n-fill)) padding-box,
    linear-gradient(
      180deg,
      rgba(255, 255, 255, calc(0.8 * var(--n-edge))),
      rgba(255, 255, 255, calc(0.8 * var(--n-edge)))
    ) border-box;
}

/* C. Строка: контейнера нет, аффорданс держит линейка под строкой ввода. */
.note.v-c {
  background: none;
  border-color: transparent;
}

.note.v-c .note__input {
  border-bottom: 1px solid rgba(111, 101, 88, 0.28);
  padding-bottom: 10px;
}

/* D. Вдавленное: кромка перевёрнута — тень сверху, свет снизу. */
.note.v-d {
  background:
    rgba(255, 255, 255, var(--n-fill)) padding-box,
    linear-gradient(
      180deg,
      rgba(120, 108, 86, calc(0.16 * var(--n-edge))) 0%,
      rgba(120, 108, 86, calc(0.05 * var(--n-edge))) 40%,
      rgba(255, 255, 255, calc(0.34 * var(--n-edge))) 100%
    ) border-box;
}

/*
 * F. Тонировка под обои: заливка не белая, а в тон обоям (зелёно-бежевый
 * 206,226,184). Панель не белеет пятном, а слегка уплотняет фон под собой —
 * контраст даёт не светлота, а насыщенность тона. Кромка та же градиентная,
 * только приглушённее: белый ободок на цветной заливке звенел бы отдельно.
 */
.note.v-f {
  background:
    rgba(206, 226, 184, var(--n-fill)) padding-box,
    linear-gradient(
      180deg,
      rgba(255, 255, 255, calc(0.6 * var(--n-edge))) 0%,
      rgba(255, 255, 255, calc(0.15 * var(--n-edge))) 30%,
      rgba(120, 108, 86, calc(0.06 * var(--n-edge))) 60%,
      rgba(255, 255, 255, calc(0.3 * var(--n-edge))) 100%
    ) border-box;
}

/*
 * Телефонная посадка. Угол круглый (round, не squircle — на мелком радиусе
 * squircle съедает видимую дугу) и панель уже: до грани верхней карточки, как
 * мобильный блок @media (max-width: 420px) в note.css. Материал наследуется от
 * выбранного варианта, меняется только геометрия — ровно то, что и делает
 * мобильный блок в проекте.
 */
.note--mobile {
  width: calc(var(--env-w) - 32px);
  corner-shape: round;
}

/* Ghost-пример прячется, когда поле в фокусе или в нём уже набран текст — иначе
   он лёг бы поверх реального ответа. В проекте это держит NoteComposer. */
.note:focus-within .note__ghost,
.note.note--typed .note__ghost {
  display: none;
}

/* --- режим «все сразу» ----------------------------------------------------- */

.compare {
  display: flex;
  flex-direction: column;
  gap: 22px;
  width: 100%;
  align-items: center;
}

.compare__item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  width: 100%;
}

.compare__tag {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.02em;
  color: var(--c-ink-soft);
  /* Подпись лежит на обоях, поэтому со своей светлой подложкой — иначе на
     синем пятне её не прочесть. */
  padding: 2px 8px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.55);
}

/* --- пульт ----------------------------------------------------------------- */

.panel {
  display: flex;
  flex-direction: column;
  gap: 18px;
  padding: 20px;
  border-radius: 20px;
  background: #fff;
  box-shadow: 0 1px 2px rgba(20, 30, 15, 0.06), 0 10px 30px rgba(20, 30, 15, 0.08);
}

.panel h1 {
  margin: 0;
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.panel h1 span {
  display: block;
  margin-top: 4px;
  font-size: 12px;
  font-weight: 400;
  line-height: 1.5;
  color: var(--c-ink-soft);
}

.group {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.group__title {
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--c-ink-faint);
}

.variants {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.variant {
  display: flex;
  flex-direction: column;
  gap: 2px;
  padding: 10px 12px;
  border: 1px solid #e6e3dd;
  border-radius: 12px;
  background: #fff;
  text-align: left;
  font: inherit;
  cursor: pointer;
  transition: border-color var(--dur-fast) var(--ease), background var(--dur-fast) var(--ease);
}

.variant:hover { background: #faf9f7; }

.variant[aria-pressed='true'] {
  border-color: #5f6f52;
  background: #f1f5ec;
}

.variant b {
  font-size: 13px;
  font-weight: 600;
}

.variant i {
  font-size: 11px;
  font-style: normal;
  line-height: 1.45;
  color: var(--c-ink-soft);
}

.row {
  display: grid;
  grid-template-columns: 96px 1fr 52px;
  align-items: center;
  gap: 10px;
  font-size: 12px;
}

.row.is-off { opacity: 0.35; }

.row output {
  font-family: var(--font-mono);
  font-size: 11px;
  text-align: right;
  color: var(--c-ink-soft);
}

input[type='range'] { width: 100%; accent-color: #5f6f52; }

.toggles {
  display: flex;
  flex-wrap: wrap;
  gap: 8px 14px;
  font-size: 12px;
}

.toggles label {
  display: flex;
  align-items: center;
  gap: 6px;
  cursor: pointer;
}

.seg {
  display: flex;
  gap: 4px;
}

.seg button {
  flex: 1;
  padding: 6px 8px;
  border: 1px solid #e6e3dd;
  border-radius: 9px;
  background: #fff;
  font: inherit;
  font-size: 12px;
  cursor: pointer;
}

.seg button[aria-pressed='true'] {
  border-color: #5f6f52;
  background: #f1f5ec;
}

.css {
  margin: 0;
  padding: 12px;
  border-radius: 12px;
  background: #1f2420;
  color: #dfe7d8;
  font-family: var(--font-mono);
  font-size: 10.5px;
  line-height: 1.55;
  white-space: pre;
  overflow-x: auto;
}

.copy {
  align-self: flex-start;
  padding: 7px 12px;
  border: none;
  border-radius: 9px;
  background: #5f6f52;
  color: #fff;
  font: inherit;
  font-size: 12px;
  cursor: pointer;
}

.note-hint {
  margin: 0;
  font-size: 11px;
  line-height: 1.5;
  color: var(--c-ink-soft);
}
</style>
</head>
<body>

<div class="stand">
  <!-- Сцена: кусок гостевой страницы — обои, карточка места и панель под ней. -->
  <div class="scene" id="scene">
    <div class="scene__paper" id="paper"></div>
    <div class="scene__inner" id="stage"></div>
  </div>

  <!-- Пульт -->
  <div class="panel">
    <h1>
      Поле заметки — материал
      <span>Панель на гостевой странице читается плотным пятном. Стенд разбирает
      материал на отдельные ручки: заливка, насыщенность, размытие, кромка, тень.
      Внизу — готовый блок для note.css.</span>
    </h1>

    <div class="group">
      <div class="group__title">Вариант</div>
      <div class="variants" id="variants"></div>
    </div>

    <div class="group">
      <div class="group__title">Материал</div>
      <div id="sliders"></div>
      <p class="note-hint" id="sliderHint"></p>
    </div>

    <div class="group">
      <div class="group__title">Сцена</div>
      <div class="seg" id="deviceSeg"></div>
      <div class="seg" id="paperSeg"></div>
      <div class="toggles">
        <label><input type="checkbox" id="tFocus"> состояние фокуса</label>
        <label><input type="checkbox" id="tEmpty"> пустое поле</label>
        <label><input type="checkbox" id="tCompare"> все сразу</label>
        <label><input type="checkbox" id="tCard" checked> карточка сверху</label>
      </div>
    </div>

    <div class="group">
      <div class="group__title">CSS</div>
      <pre class="css" id="cssOut"></pre>
      <button class="copy" id="copy">Скопировать</button>
    </div>
  </div>
</div>

<script>
/*
 * Пресеты. Каждый — только набор чисел для --n-* плюс, при нужде, класс со
 * структурной правкой (v-b/v-c/v-d). Ничего, кроме этих двух вещей, вариант о
 * себе не знает: панель на сцене одна и та же разметка.
 *
 * focusStep — насколько заливка светлеет в фокусе. В проекте это .35 → .50, то
 * есть шаг .15; от лёгкой базы тот же шаг читается вспышкой, поэтому у лёгких
 * вариантов он меньше.
 */
const VARIANTS = [
  {
    id: 'now', name: 'Сейчас', cls: '',
    hint: 'Как на странице: saturate 1.4, заливка .35, тень карточки-героя.',
    v: { fill: .35, sat: 1.4, blur: 12, edge: 1, hl1: .58, hl2: .34, sunk: 0,
         sh1y: 4, sh1b: 12, sh1a: .13, sh2y: 26, sh2b: 54, sh2a: .2,
         r: 36, pt: 12, px: 16, pb: 16, gap: 10, min: 40, send: 22, label: 12, focusStep: .15 },
  },
  {
    id: 'a', name: 'A. Тоньше стекло', cls: '',
    hint: 'Та же конструкция, другие дозировки: заливка .16, saturate 1.02, blur 18, вместо тени карточки — своя мягкая.',
    v: { fill: .16, sat: 1.02, blur: 18, edge: .8, hl1: .42, hl2: .22, sunk: 0,
         sh1y: 1, sh1b: 3, sh1a: .05, sh2y: 8, sh2b: 20, sh2a: .05,
         r: 36, pt: 12, px: 16, pb: 16, gap: 10, min: 40, send: 22, label: 12, focusStep: .1 },
  },
  {
    id: 'aplus', name: 'A+ Рекомендация', cls: '',
    hint: 'A плюс подрезанная пустота: поля 10/14/12, gap 6, строка 30, «Send» 17. Панель ~92px вместо 117.',
    v: { fill: .16, sat: 1.02, blur: 18, edge: .8, hl1: .42, hl2: .22, sunk: 0,
         sh1y: 1, sh1b: 3, sh1a: .05, sh2y: 8, sh2b: 20, sh2a: .05,
         r: 32, pt: 10, px: 14, pb: 12, gap: 6, min: 30, send: 17, label: 11, focusStep: .1 },
  },
  {
    id: 'e', name: 'E. Молочное', cls: '',
    hint: 'saturate 1.0 — стекло не насыщает обои под собой, контраст держит светлотой, а не цветом. Заливка .22 белым, blur 16, своя мягкая тень.',
    v: { fill: .22, sat: 1.0, blur: 16, edge: .85, hl1: .5, hl2: .28, sunk: 0,
         sh1y: 1, sh1b: 3, sh1a: .05, sh2y: 10, sh2b: 24, sh2a: .06,
         r: 36, pt: 12, px: 16, pb: 16, gap: 10, min: 40, send: 22, label: 12, focusStep: .1 },
  },
  {
    id: 'ship', name: 'Молочное подрезанное ✓', cls: '',
    hint: 'Выбранный вариант: молочный материал E (saturate 1.0, заливка .22, своя мягкая тень) + подрезанная геометрия A+ (поля 10/14/12, gap 6, строка 30, «Send» 17, радиус 32). Это ушло в note.css.',
    v: { fill: .22, sat: 1.0, blur: 16, edge: .85, hl1: .5, hl2: .28, sunk: 0,
         sh1y: 1, sh1b: 3, sh1a: .05, sh2y: 10, sh2b: 24, sh2a: .06,
         r: 32, pt: 10, px: 14, pb: 12, gap: 6, min: 30, send: 17, label: 11, focusStep: .1 },
  },
  {
    id: 'f', name: 'F. Тонировка под обои', cls: 'v-f',
    hint: 'Заливка не белая, а в тон обоям: панель не белеет пятном, а уплотняет фон под собой. Контраст тоном, а не светлотой.',
    v: { fill: .5, sat: 1.05, blur: 16, edge: .7, hl1: .35, hl2: .2, sunk: 0,
         sh1y: 1, sh1b: 3, sh1a: .05, sh2y: 10, sh2b: 24, sh2a: .06,
         r: 36, pt: 12, px: 16, pb: 16, gap: 10, min: 40, send: 22, label: 12, focusStep: .1 },
  },
  {
    id: 'g', name: 'G. Нимб', cls: '',
    hint: 'A+ по геометрии, но тень одна: широкая мягкая амбиентная (без ближней). Чистый нимб под панелью вместо двойной тени.',
    v: { fill: .16, sat: 1.02, blur: 18, edge: .8, hl1: .42, hl2: .22, sunk: 0,
         sh1y: 0, sh1b: 0, sh1a: 0, sh2y: 14, sh2b: 40, sh2a: .08,
         r: 32, pt: 10, px: 14, pb: 12, gap: 6, min: 30, send: 17, label: 11, focusStep: .1 },
  },
  {
    id: 'b', name: 'B. Контур', cls: 'v-b',
    hint: 'Ни заливки, ни блюра, ни тени — одна белая волосяная кромка. Легче всех, но на пёстром кадре текст спорит с фоном.',
    v: { fill: 0, sat: 1, blur: 0, edge: 1, hl1: 0, hl2: 0, sunk: 0,
         sh1y: 0, sh1b: 0, sh1a: 0, sh2y: 0, sh2b: 0, sh2a: 0,
         r: 36, pt: 12, px: 16, pb: 16, gap: 10, min: 40, send: 22, label: 12, focusStep: .08 },
  },
  {
    id: 'c', name: 'C. Строка', cls: 'v-c',
    hint: 'Плашки нет вовсе: подпись, строка, линейка под ней. Воздушнее некуда, но блок распадается на три надписи на обоях.',
    v: { fill: 0, sat: 1, blur: 0, edge: 0, hl1: 0, hl2: 0, sunk: 0,
         sh1y: 0, sh1b: 0, sh1a: 0, sh2y: 0, sh2b: 0, sh2a: 0,
         r: 0, pt: 0, px: 4, pb: 0, gap: 10, min: 40, send: 22, label: 12, focusStep: 0 },
  },
  {
    id: 'd', name: 'D. Вдавленное', cls: 'v-d',
    hint: 'Не парит, а утоплено в обои: внутренняя тень сверху, свет снизу. Сильнее читается как ввод, но материал другой, чем у крестика и карточки.',
    v: { fill: .10, sat: 1, blur: 14, edge: 1, hl1: 0, hl2: .55, sunk: .10,
         sh1y: 0, sh1b: 0, sh1a: 0, sh2y: 0, sh2b: 0, sh2a: 0,
         r: 36, pt: 12, px: 16, pb: 16, gap: 10, min: 40, send: 22, label: 12, focusStep: .08 },
  },
];

/*
 * Ползунки. `off` — при каких вариантах ручка ничего не делает (у контура нет
 * заливки, у строки нет ни плашки, ни тени): такие гасим, а не прячем, чтобы
 * было видно, чего у варианта нет по устройству, а не по нулю.
 */
const SLIDERS = [
  { key: 'fill', label: 'заливка',   min: 0, max: .6,  step: .01, fmt: v => v.toFixed(2), off: ['c'] },
  { key: 'sat',  label: 'насыщ.',    min: 1, max: 1.8, step: .01, fmt: v => v.toFixed(2), off: ['b', 'c'] },
  { key: 'blur', label: 'размытие',  min: 0, max: 30,  step: 1,   fmt: v => v + 'px',     off: ['b', 'c'] },
  { key: 'edge', label: 'кромка',    min: 0, max: 1.4, step: .05, fmt: v => v.toFixed(2), off: ['c'] },
  { key: 'sh',   label: 'тень',      min: 0, max: 1.6, step: .05, fmt: v => v.toFixed(2), off: ['b', 'c', 'd'] },
  { key: 'sunk', label: 'вдавлено',  min: 0, max: .3,  step: .01, fmt: v => v.toFixed(2), off: [] },
  { key: 'r',    label: 'радиус',    min: 0, max: 48,  step: 1,   fmt: v => v + 'px',     off: ['c'] },
  { key: 'min',  label: 'высота',    min: 20, max: 60, step: 1,   fmt: v => v + 'px',     off: [] },
  { key: 'send', label: 'Send',      min: 14, max: 26, step: 1,   fmt: v => v + 'px',     off: [] },
];

const EXAMPLE = "Can't wait — can I bring a friend?";

/*
 * Мобильная геометрия — фикс-блок @media (max-width: 420px) из note.css. На
 * телефоне посадка не настраивается, она уже выбрана: угол круглее и явнее,
 * плашка ниже и уже, «Send» мельче. Материал телефон наследует от десктопа,
 * поэтому здесь только геометрия. Стенд показывает вариант на этих числах, а
 * геометрические ползунки в мобильном режиме гасит.
 */
const MOBILE = { r: 24, pt: 12, px: 12, pb: 16, gap: 8, min: 32, send: 19 };
const MOBILE_KEYS = ['r', 'min', 'send'];

const state = {
  // Открываемся на выбранном варианте — том, что уже ушёл в note.css.
  variant: 'ship',
  // Посадка сцены: desktop (геометрия варианта) или mobile (фикс-блок note.css).
  device: 'desktop',
  // Правки ползунков поверх пресета. Сбрасываются при смене варианта: ручка,
  // пережившая переключение, врала бы про вариант.
  tweak: {},
  // Множитель обеих теней — отдельно от tweak, потому что он не значение, а
  // коэффициент к двум альфам пресета.
  shk: 1,
  focus: false,
  empty: false,
  compare: false,
  card: true,
  paper: '50% 30%',
};

const byId = (id) => VARIANTS.find((x) => x.id === id);
const val = (key) => (key in state.tweak ? state.tweak[key] : byId(state.variant).v[key]);

/* --- разметка панели ------------------------------------------------------- */

function noteMarkup() {
  const text = state.empty ? '' : EXAMPLE;
  return `
    <span class="note__label">Add note</span>
    <div class="note__input">
      ${state.empty ? '' : `<span class="note__ghost">${text}<span class="note__caret"></span></span>`}
      <textarea class="note__field" rows="1" placeholder=""></textarea>
    </div>
    <button class="note__send" type="button">Send</button>`;
}

function makeNote(id) {
  const variant = byId(id);
  const el = document.createElement('div');
  el.className = 'note' + (variant.cls ? ' ' + variant.cls : '');
  el.innerHTML = noteMarkup();
  applyVars(el, id, id === state.variant && !state.compare);
  wireField(el);
  return el;
}

/*
 * Настоящий фокус и ввод. Поле не readonly: клик в него даёт :focus-within
 * (материал светлеет ровно как на живой странице), и в нём можно набирать. Пока
 * есть текст — растёт под него и прячет ghost-пример, чтобы тот не лёг поверх
 * набранного. Это единственная логика ввода на стенде; в проекте её держит
 * NoteComposer.
 */
function wireField(el) {
  const field = el.querySelector('.note__field');
  if (!field) return;
  const grow = () => {
    field.style.height = 'auto';
    field.style.height = field.scrollHeight + 'px';
    el.classList.toggle('note--typed', field.value.trim().length > 0);
  };
  field.addEventListener('input', grow);
}

/*
 * Раскладка чисел в переменные. tweaks применяются только к выбранному варианту:
 * в режиме сравнения все шесть стоят на своих пресетах, иначе сравнивать нечего.
 */
function applyVars(el, id, withTweaks) {
  const base = byId(id).v;
  const get = (k) => (withTweaks && k in state.tweak ? state.tweak[k] : base[k]);
  const shk = withTweaks ? state.shk : 1;

  el.style.setProperty('--n-fill', get('fill'));
  el.style.setProperty('--n-sat', get('sat'));
  el.style.setProperty('--n-blur', get('blur') + 'px');
  el.style.setProperty('--n-edge', get('edge'));
  el.style.setProperty('--n-hl1', get('hl1'));
  el.style.setProperty('--n-hl2', get('hl2'));
  el.style.setProperty('--n-sunk', get('sunk'));
  el.style.setProperty('--n-sh1y', base.sh1y + 'px');
  el.style.setProperty('--n-sh1b', base.sh1b + 'px');
  el.style.setProperty('--n-sh1a', (base.sh1a * shk).toFixed(3));
  el.style.setProperty('--n-sh2y', base.sh2y + 'px');
  el.style.setProperty('--n-sh2b', base.sh2b + 'px');
  el.style.setProperty('--n-sh2a', (base.sh2a * shk).toFixed(3));
  el.style.setProperty('--n-r', get('r') + 'px');
  el.style.setProperty('--n-pt', get('pt') + 'px');
  el.style.setProperty('--n-px', get('px') + 'px');
  el.style.setProperty('--n-pb', get('pb') + 'px');
  el.style.setProperty('--n-gap', get('gap') + 'px');
  el.style.setProperty('--n-min', get('min') + 'px');
  el.style.setProperty('--n-send', get('send') + 'px');
  el.style.setProperty('--n-label', get('label') + 'px');
  el.style.setProperty('--n-focus-step', base.focusStep);

  /*
   * Телефонная посадка. Геометрия — фикс-блок note.css поверх любых чисел
   * варианта и ползунков: на телефоне она не настраивается. Материал (заливка,
   * блюр, кромка, тень) остаётся варианта — ради него мобильный вид и нужен.
   */
  el.classList.toggle('note--mobile', state.device === 'mobile');
  if (state.device === 'mobile') {
    el.style.setProperty('--n-r', MOBILE.r + 'px');
    el.style.setProperty('--n-pt', MOBILE.pt + 'px');
    el.style.setProperty('--n-px', MOBILE.px + 'px');
    el.style.setProperty('--n-pb', MOBILE.pb + 'px');
    el.style.setProperty('--n-gap', MOBILE.gap + 'px');
    el.style.setProperty('--n-min', MOBILE.min + 'px');
    el.style.setProperty('--n-send', MOBILE.send + 'px');
  }

  el.classList.toggle('is-focus', state.focus);
}

function cardMarkup() {
  return `
    <div class="card" id="card">
      <img class="card__photo" src="../../public/demo/1.jpg" alt=""
           onerror="this.closest('.card').classList.add('card--nophoto')">
      <div class="card__scrim"></div>
      <div class="card__body">
        <div class="card__name">Cooperative Chorny</div>
        <div class="card__address">12 Bolshaya Nikitskaya</div>
      </div>
      <div class="card__dots"><i class="on"></i><i></i><i></i></div>
    </div>`;
}

function renderStage() {
  const stage = document.getElementById('stage');
  stage.innerHTML = state.card && !state.compare ? cardMarkup() : '';

  if (!state.compare) {
    stage.appendChild(makeNote(state.variant));
    return;
  }

  const box = document.createElement('div');
  box.className = 'compare';
  for (const variant of VARIANTS) {
    const item = document.createElement('div');
    item.className = 'compare__item';
    const tag = document.createElement('span');
    tag.className = 'compare__tag';
    tag.textContent = variant.name;
    item.append(tag, makeNote(variant.id));
    box.appendChild(item);
  }
  stage.appendChild(box);
}

/* --- пульт ----------------------------------------------------------------- */

function renderVariants() {
  const box = document.getElementById('variants');
  box.innerHTML = '';
  for (const variant of VARIANTS) {
    const b = document.createElement('button');
    b.className = 'variant';
    b.setAttribute('aria-pressed', String(variant.id === state.variant));
    b.innerHTML = `<b>${variant.name}</b><i>${variant.hint}</i>`;
    b.onclick = () => {
      state.variant = variant.id;
      state.tweak = {};
      state.shk = 1;
      renderVariants();
      renderSliders();
      renderStage();
      renderCss();
    };
    box.appendChild(b);
  }
}

function renderSliders() {
  const box = document.getElementById('sliders');
  box.innerHTML = '';
  const current = byId(state.variant);

  for (const s of SLIDERS) {
    // На телефоне геометрия — фикс-блок note.css, крутить её тут нельзя: радиус,
    // высоту и «Send» гасим и показываем на мобильных числах.
    const mobileFixed = state.device === 'mobile' && MOBILE_KEYS.includes(s.key);
    const row = document.createElement('div');
    row.className = 'row' + (s.off.includes(state.variant) || mobileFixed ? ' is-off' : '');
    const value = mobileFixed ? MOBILE[s.key] : (s.key === 'sh' ? state.shk : val(s.key));

    row.innerHTML = `<label for="sl-${s.key}">${s.label}</label>`;
    const input = document.createElement('input');
    input.type = 'range';
    input.id = 'sl-' + s.key;
    input.min = s.min; input.max = s.max; input.step = s.step; input.value = value;
    input.disabled = mobileFixed;
    const out = document.createElement('output');
    out.textContent = s.fmt(Number(value));

    input.oninput = () => {
      const v = Number(input.value);
      if (s.key === 'sh') state.shk = v;
      else state.tweak[s.key] = v;
      out.textContent = s.fmt(v);
      // Панель одна — перерисовывать её целиком на каждый кадр ползунка незачем,
      // достаточно переписать переменные на живом узле.
      const live = document.querySelector('.scene .note');
      if (live) applyVars(live, state.variant, true);
      renderCss();
    };

    row.append(input, out);
    box.appendChild(row);
  }

  document.getElementById('sliderHint').textContent = state.compare
    ? 'В режиме «все сразу» ползунки не применяются: варианты стоят на своих числах.'
    : state.device === 'mobile'
      ? `Ползунки правят материал варианта «${current.name}». Геометрия (радиус, высота, «Send») на телефоне — фикс-блок note.css, тут не крутится.`
      : `Ползунки правят вариант «${current.name}». Переключение варианта их сбрасывает.`;
}

function renderPaperSeg() {
  const seg = document.getElementById('paperSeg');
  const spots = [
    ['Бледный верх', '50% 8%'],
    ['Центр', '50% 30%'],
    ['Синее пятно', '18% 92%'],
  ];
  seg.innerHTML = '';
  for (const [name, pos] of spots) {
    const b = document.createElement('button');
    b.textContent = name;
    b.setAttribute('aria-pressed', String(pos === state.paper));
    b.onclick = () => {
      state.paper = pos;
      document.getElementById('paper').style.setProperty('--paper-pos', pos);
      renderPaperSeg();
    };
    seg.appendChild(b);
  }
}

/*
 * Посадка: десктоп или телефон. Меняет только геометрию плашки — материал
 * варианта общий. Мобильный вид нужен затем, что лёгкий материал обязан держаться
 * и на тесной телефонной посадке, а не только на просторной десктопной.
 */
function renderDeviceSeg() {
  const seg = document.getElementById('deviceSeg');
  const devices = [['Десктоп', 'desktop'], ['Телефон', 'mobile']];
  seg.innerHTML = '';
  for (const [name, id] of devices) {
    const b = document.createElement('button');
    b.textContent = name;
    b.setAttribute('aria-pressed', String(id === state.device));
    b.onclick = () => {
      state.device = id;
      renderDeviceSeg();
      renderSliders();
      renderStage();
      renderCss();
    };
    seg.appendChild(b);
  }
}

/*
 * Сборка готового блока для note.css. Печатается ровно то, что сейчас на сцене,
 * и в той же форме, в какой правило живёт в проекте (две заливки padding-box /
 * border-box, пять слоёв тени) — чтобы вставлять заменой, а не переписывать.
 */
function renderCss() {
  const base = byId(state.variant).v;
  const g = (k) => val(k);
  const a = (x) => Number(x).toFixed(2).replace(/0$/, '').replace(/\.$/, '');
  const sh1 = (base.sh1a * state.shk).toFixed(3).replace(/0+$/, '');
  const sh2 = (base.sh2a * state.shk).toFixed(3).replace(/0+$/, '');

  const shadows = [
    g('sunk') > 0 ? `    inset 0 2px 5px rgba(63, 46, 26, ${a(g('sunk'))}),` : null,
    g('hl1') > 0 ? `    inset 0 1px 0 rgba(255, 255, 255, ${a(g('hl1'))}),` : null,
    g('hl2') > 0 ? `    inset 0 -1px 0 rgba(255, 255, 255, ${a(g('hl2'))}),` : null,
    base.sh1a * state.shk > 0 ? `    0 ${base.sh1y}px ${base.sh1b}px rgba(63, 46, 26, ${sh1}),` : null,
    base.sh2a * state.shk > 0 ? `    0 ${base.sh2y}px ${base.sh2b}px rgba(63, 46, 26, ${sh2}),` : null,
  ].filter(Boolean);
  if (shadows.length) shadows[shadows.length - 1] = shadows.at(-1).replace(/,$/, ';');

  const e = (x) => a(x * g('edge'));
  // Заливка: у «Тонировки под обои» (F) она не белая, а в тон обоям. Остальные —
  // белым стеклом.
  const fillRgb = state.variant === 'f' ? '206, 226, 184' : '255, 255, 255';
  const edgeStops = state.variant === 'd'
    ? `      rgba(120, 108, 86, ${e(.16)}) 0%,\n` +
      `      rgba(120, 108, 86, ${e(.05)}) 40%,\n` +
      `      rgba(255, 255, 255, ${e(.34)}) 100%`
    : state.variant === 'b'
      ? `      rgba(255, 255, 255, ${e(.8)}),\n      rgba(255, 255, 255, ${e(.8)})`
      : state.variant === 'f'
        ? `      rgba(255, 255, 255, ${e(.6)}) 0%,\n` +
          `      rgba(255, 255, 255, ${e(.15)}) 30%,\n` +
          `      rgba(120, 108, 86, ${e(.06)}) 60%,\n` +
          `      rgba(255, 255, 255, ${e(.3)}) 100%`
        : `      rgba(255, 255, 255, ${e(.72)}) 0%,\n` +
          `      rgba(255, 255, 255, ${e(.22)}) 26%,\n` +
          `      rgba(120, 108, 86, ${e(.08)}) 55%,\n` +
          `      rgba(255, 255, 255, ${e(.3)}) 88%,\n` +
          `      rgba(255, 255, 255, ${e(.46)}) 100%`;

  const lines = ['.note {'];

  if (state.variant === 'c') {
    lines.push('  /* Плашки нет: поле держит линейка под строкой ввода. */');
    lines.push('  background: none;');
    lines.push('  border: none;');
    lines.push('  box-shadow: none;');
    lines.push(`  padding: ${g('pt')}px ${g('px')}px ${g('pb')}px;`);
  } else {
    lines.push('  border: 1px solid transparent;');
    lines.push('  background:');
    lines.push(`    rgba(${fillRgb}, ${a(g('fill'))}) padding-box,`);
    lines.push('    linear-gradient(');
    lines.push('      180deg,');
    lines.push(edgeStops);
    lines.push('    ) border-box;');
    if (g('blur') > 0 || g('sat') !== 1) {
      lines.push(`  backdrop-filter: blur(${g('blur')}px) saturate(${a(g('sat'))});`);
      lines.push(`  -webkit-backdrop-filter: blur(${g('blur')}px) saturate(${a(g('sat'))});`);
    }
    if (shadows.length) {
      lines.push('  box-shadow:');
      lines.push(...shadows);
    } else {
      lines.push('  box-shadow: none;');
    }
    lines.push(`  padding: ${g('pt')}px ${g('px')}px ${g('pb')}px;`);
    lines.push(`  gap: ${g('gap')}px;`);
    lines.push(`  border-radius: ${g('r')}px;`);
  }
  lines.push('}');
  lines.push('');
  lines.push('.note__field {');
  lines.push(`  min-height: ${g('min')}px;`);
  lines.push('}');
  lines.push('');
  lines.push('.note__send {');
  lines.push(`  font-size: ${g('send')}px;`);
  lines.push('}');

  if (state.variant === 'c') {
    lines.push('');
    lines.push('.note__input {');
    lines.push('  border-bottom: 1px solid rgba(111, 101, 88, 0.28);');
    lines.push('  padding-bottom: 10px;');
    lines.push('}');
  }

  /*
   * Мобильный блок. Материал (заливка, блюр, кромка, тень) телефон наследует от
   * базового .note выше — здесь только своя геометрия: угол круглее и явнее
   * (round вместо squircle — на мелком радиусе squircle съедает дугу), плашка
   * ниже и уже. Числа фиксированы; на стенде их переключатель «Телефон»
   * показывает, но не крутит. Блок идёт в конец note.css, ниже базовых правил.
   */
  lines.push('');
  lines.push('@media (max-width: 420px) {');
  lines.push('  .note {');
  lines.push(`    padding: ${MOBILE.pt}px ${MOBILE.px}px ${MOBILE.pb}px;`);
  lines.push(`    gap: ${MOBILE.gap}px;`);
  lines.push(`    border-radius: ${MOBILE.r}px;`);
  lines.push('    corner-shape: round;');
  lines.push('  }');
  lines.push('');
  lines.push('  .note__field {');
  lines.push(`    min-height: ${MOBILE.min}px;`);
  lines.push('  }');
  lines.push('');
  lines.push('  .note__send {');
  lines.push(`    font-size: ${MOBILE.send}px;`);
  lines.push('  }');
  lines.push('}');

  document.getElementById('cssOut').textContent = lines.join('\n');
}

/* --- тумблеры -------------------------------------------------------------- */

function bindToggle(id, key, after) {
  const el = document.getElementById(id);
  el.checked = state[key];
  el.onchange = () => {
    state[key] = el.checked;
    (after || (() => {}))();
    renderStage();
    renderCss();
  };
}

bindToggle('tFocus', 'focus');
bindToggle('tEmpty', 'empty');
bindToggle('tCompare', 'compare', renderSliders);
bindToggle('tCard', 'card');

document.getElementById('copy').onclick = async () => {
  const btn = document.getElementById('copy');
  try {
    await navigator.clipboard.writeText(document.getElementById('cssOut').textContent);
    btn.textContent = 'Скопировано';
  } catch {
    btn.textContent = 'Выдели и скопируй сам';
  }
  setTimeout(() => { btn.textContent = 'Скопировать'; }, 1400);
};

document.getElementById('paper').style.setProperty('--paper-pos', state.paper);
renderVariants();
renderSliders();
renderDeviceSeg();
renderPaperSeg();
renderStage();
renderCss();
</script>
</body>
