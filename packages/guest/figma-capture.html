<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=375, initial-scale=1" />
    <title>Invite guest screen capture</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Inter+Tight:wght@400;500;600&family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Roboto+Mono:wght@400&display=swap" rel="stylesheet" />
    <style>
      html, body, #root { width: 375px; height: 900px; margin: 0; overflow: hidden; }
      html[data-screen="browse"] #root { background: url('/src/assets/wheel-wallpaper.png') center / cover no-repeat; }
      html[data-screen="selected"] #root,
      html[data-screen="done"] #root { background: url('/src/assets/wallpaper.webp') center / 100% 100% no-repeat; }
    </style>
    <script src="https://mcp.figma.com/mcp/html-to-design/capture.js" async></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/figma-capture.tsx"></script>
  </body>
</html>
